{{ with .Page.Params.lokale_werken }}
<div class="not-prose my-8 grid grid-cols-1 md:grid-cols-3 gap-5">
    {{ range . }}
    <a href="{{ .site }}" target="_blank" rel="noopener" class="no-underline group flex flex-col justify-between bg-white/80 hover:bg-white rounded-2xl border border-olive-soft/20 hover:border-olive-soft/40 p-5 shadow-sm hover:shadow-md transition-all duration-200">
        <div>
            {{ if .logo }}
            <div class="h-14 flex items-center justify-start mb-3">
                <img src="{{ .logo }}" alt="{{ .naam }}" class="max-h-12 max-w-[140px] object-contain m-0">
            </div>
            {{ end }}
            <h4 class="font-bold text-sm text-brown-dark group-hover:text-red-palestina transition-colors leading-snug m-0">
                {{ .naam }}
            </h4>
            {{ with .omschrijving }}
            <p class="text-xs text-brown-dark/70 mt-1.5 leading-relaxed m-0">
                {{ . }}
            </p>
            {{ end }}
        </div>
        <div class="pt-3 mt-4 border-t border-olive-soft/10 flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-olive-soft group-hover:text-red-palestina transition-colors">
            <span>Bezoek website</span>
            <span class="group-hover:translate-x-1 transition-transform">&rarr;</span>
        </div>
    </a>
    {{ end }}
</div>
{{ end }}
